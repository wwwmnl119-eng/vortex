workflows:
  ios-vortex-workflow:
    name: Vortex iOS IPA Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Install dependencies
        script: |
          cd client
          flutter pub get
      - name: Build iOS IPA
        script: |
          cd client
          flutter build ipa --release --no-codesign
    artifacts:
      - client/build/ios/ipa/*.ipa
