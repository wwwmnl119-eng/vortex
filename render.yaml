services:
  - type: web
    name: vortex
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: vortex-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: LATEST_VERSION
        value: 1.0.0
      - key: MIN_VERSION
        value: 1.0.0
      - key: FORCE_UPDATE
        value: false
      - key: CHANGELOG
        value: Первый релиз Vortex

databases:
  - name: vortex-db
    plan: free
    databaseName: vortex
    user: vortex_user
